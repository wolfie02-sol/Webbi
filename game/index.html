<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14122a">
<title>Cryptwild</title>
<meta name="description" content="Cryptwild: an original monster-collecting RPG with the CRYPT card collection.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314122a'/%3E%3Cpath d='M5 4h6l1 8H4z' fill='%23f4b840'/%3E%3Cpath d='M7 6h2l.5 4h-3z' fill='%23fff4c0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="320" height="208"></canvas>
    <div id="overlay">
      <div id="hud"></div>
      <div id="battlehud"></div>
      <div id="choice" hidden></div>
      <div id="dialog" hidden><div id="speaker"></div><div id="dialogtext"></div><div id="more">▼</div></div>
      <div id="toasts"></div>
    </div>
  </div>
  <div id="dock">
    <div id="pad">
      <div id="dpad">
        <button data-k="up" aria-label="Up">▲</button>
        <button data-k="left" aria-label="Left">◀</button>
        <button data-k="right" aria-label="Right">▶</button>
        <button data-k="down" aria-label="Down">▼</button>
      </div>
      <button id="padmenu" data-k="menu">MENU</button>
      <div id="ab">
        <button data-k="b" class="btn-b">B</button>
        <button data-k="a" class="btn-a">A</button>
      </div>
    </div>
    <div id="commands" hidden></div>
  </div>
  <div id="panels"></div>
</div>
<noscript>Cryptwild needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
